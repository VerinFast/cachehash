[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cachehash"
authors = [
  { name="Jason Nichols", email="github@verinfast.com" },
  { name="Sean Conrad", email="github@verinfast.com"}
]
description = "This tool memoizes data to sqlite."
readme = "README.md"
requires-python = ">=3.11,<3.15"
# Source-available, not open source: use it, copy it, modify it — but do not
# offer it to others as a hosted or managed service. Full text in LICENSE.
license = "Elastic-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]
dynamic = ["version"]
dependencies = [
    "xxhash>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.1",
    "pytest",
    "pytest-cov",
    "coverage>=7.10.3,<7.17.0",
]

[project.urls]
Homepage = "https://github.com/VerinFast/cachehash"
"Bug Tracker" = "https://github.com/VerinFast/cachehash/issues"
Source = "https://github.com/VerinFast/cachehash"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]

[tool.hatch.version]
path = "VERSION.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cachehash"]
